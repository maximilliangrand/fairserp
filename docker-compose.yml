# One-command deploy:
#   FAIRSERP_API_KEYS=your-secret-key docker compose up -d
# The default "strict" profile only runs providers with disclosed provenance. With no
# provider keys, opt in to one explicitly, e.g. FAIRSERP_OPT_IN=firecrawl (see README).
services:
  fairserp:
    build: .
    image: ${FAIRSERP_IMAGE:-fairserp:local}
    restart: unless-stopped
    ports:
      # Localhost only by default; put a TLS reverse proxy in front for remote access.
      - "${FAIRSERP_BIND:-127.0.0.1}:${FAIRSERP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - FAIRSERP_API_KEYS=${FAIRSERP_API_KEYS:?set FAIRSERP_API_KEYS (comma separated keys)}
      - FAIRSERP_CACHE_BACKEND=redis://redis-cache:6379/0
      - FAIRSERP_STATE_BACKEND=redis://redis-state:6379/0
      # Passed through from the shell when set (a bare name forwards the host value).
      - FAIRSERP_PUBLIC_URL
      - FAIRSERP_PROFILE
      - FAIRSERP_OPT_IN
      - FAIRSERP_NONCOMMERCIAL_DEPLOYMENT
      - FAIRSERP_SERPAPI_ENGINES
      - FAIRSERP_ORGANIC_PRIORITY
      - FAIRSERP_ENRICHERS
      - FAIRSERP_STRICT_PARAMS
      - FAIRSERP_UPSTREAM_BUDGETS
      - FAIRSERP_USER_AGENT
      - FAIRSERP_LOG_QUERIES
      - FAIRSERP_BRAVE_API_KEY
      - FAIRSERP_MOJEEK_API_KEY
      - FAIRSERP_TAVILY_API_KEY
      - FAIRSERP_EXA_API_KEY
      - FAIRSERP_PARALLEL_API_KEY
      - FAIRSERP_JINA_API_KEY
      - FAIRSERP_FIRECRAWL_API_KEY
      - FAIRSERP_MARGINALIA_API_KEY
      - FAIRSERP_MARGINALIA_COMMERCIAL_KEY
      - FAIRSERP_SEARXNG_URL
      - FAIRSERP_NOMINATIM_URL
    depends_on:
      redis-cache:
        condition: service_healthy
      redis-state:
        condition: service_healthy

  # Disposable: fragments, archive, async jobs. Evicts least recently used keys when full.
  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Accounting: quotas, upstream budgets, circuit breakers, host limiters. Never evicts.
  redis-state:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-state:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-state:
